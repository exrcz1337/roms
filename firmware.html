<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmware Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <header>
        <div class="container header-content">
            <a href="index.html" class="nav-link" data-i18n="back">Back to Home</a>
            <div class="lang-switcher">
                <label data-i18n="language">Language:</label>
                <select id="lang-select">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container" id="firmware-details">
        <!-- Details will be loaded here -->
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        function renderFirmwareDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const fwId = urlParams.get('id');
            const fw = firmwares.find(f => f.id === fwId);
            
            const container = document.getElementById('firmware-details');
            
            if (!fw) {
                container.innerHTML = '<p>Firmware not found.</p>';
                return;
            }

            document.title = fw.name;

            container.innerHTML = `
                <h1 class="fw-title">${fw.name}</h1>
                <img src="${fw.banner}" alt="Banner" class="fw-banner">
                
                <p class="fw-desc">${fw.description[currentLang]}</p>
                
                <h2>${translations[currentLang].tutorial}</h2>
                <div class="fw-tutorial">
                    ${fw.tutorial[currentLang].replace(/\n/g, '<br>')}
                </div>
                
                <h2>${translations[currentLang].screenshots}</h2>
                <div class="screenshot-slider-container">
                    <button class="slider-btn prev-btn" onclick="moveSlider(-1)">&#10094;</button>
                    <div class="fw-screenshots" id="slider-track">
                        ${fw.screenshots.map(src => `<img src="${src}" alt="Screenshot">`).join('')}
                    </div>
                    <button class="slider-btn next-btn" onclick="moveSlider(1)">&#10095;</button>
                </div>
                
                <div class="download-section">
                    <a href="${fw.downloadLink}" class="btn btn-large" target="_blank">${translations[currentLang].download}</a>
                </div>
            `;
        }

        function moveSlider(direction) {
            const track = document.getElementById('slider-track');
            // Scroll by one image width roughly (approx 200px image + gap)
            track.scrollBy({ left: direction * 250, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', renderFirmwareDetails);
        window.addEventListener('languageChanged', renderFirmwareDetails);
    </script>
</body>
</html>
